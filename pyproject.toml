[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nii101-spectral-repair"
version = "0.1.1"
description = "Interactive spectral repair editor using ACE-Step 1.5"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.13"
dependencies = ["ace-step==1.5.0"]

[project.scripts]
spectral-repair = "launcher:main"

[tool.setuptools]
py-modules = ["launcher"]

[tool.setuptools.packages.find]
where = ["."]
include = ["acestep.experiments.spectral_repair*"]
namespaces = true

[tool.setuptools.package-data]
"acestep.experiments.spectral_repair" = ["*.md", "editor_assets/*", "docs/audio/*", "docs/images/*", "docs/masks/*", "docs/*.json"]
